name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Neo-matrix-coder
          outputs: |
            dist/github-contribution-grid-snake.svg?branch=output
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&branch=output
